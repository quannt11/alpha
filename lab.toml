# Global lab configuration. Secrets are NOT here: labd reads them at runtime
# from secrets_files (first file wins per key). Agents can never read those.
[lab]
state_dir = "~/.local/state/lab"
secrets_files = ["~/.config/lab/secrets.env", "~/Work/discord-reporter/.env"]
max_concurrent_agents = 3          # per project: its scout / researcher / analyst share these
max_concurrent_threads = 8         # per project: research threads never wait on each other (each has its own pods)
max_concurrent_concierge = 2       # per project: Discord answers never queue behind background work
timezone = "Asia/Ho_Chi_Minh"

[claude]
bin = "claude"

[runpod]
ssh_key = "~/.ssh/runpod_pic"      # PiC key; the .pub goes into every pod's PUBLIC_KEY
image = "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404"

[vast]
# Which Vast.ai hosts leases may rent from (VAST_API_KEY in secrets.env, "VAST" in a project's cloud_order).
# Marketplace hosts vary a lot: verified hosts only, plus these floors. Machines that failed to come up are
# blacklisted by the fleet and skipped.
min_reliability = 0.97
min_inet_down_mbps = 200       # model downloads
max_inet_usd_per_tb = 20       # some hosts charge a lot for bandwidth, which the budget does not see
min_cuda = 12.8                # the pytorch image is CUDA 12.8
min_offer_hours = 24           # the host's listing must stay up at least this long
datacenter_only = false
# image = "..."                # default: the fleet's image (the same as Runpod's)

[maintainer]
# Discord user ids allowed to change the lab itself by writing "@bot maint: <what to change>".
operators = []                       # Discord user ids of your operators
auto_deploy = true                   # false: every change waits for "maint approve m-N"
idle_wait_minutes = 20               # a deploy waits this long for running agents to finish
