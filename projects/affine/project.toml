name = "affine"
# Test mode applies [fleet.test_policy] (one H100 per experiment). Off since 2026-09-24 (operator, m-2):
# real runs, the only limit is budget.daily_usd. Set to true to bring the policy back.
test_mode = false
root = "~/Work/affine"             # first-level project folder (all repos under it)
pod_prefix = "Pi_affine"           # pods are Pi_affine-01..N; Pi_affine stays the human dev box

[discord]
# Test server "Pi", channel #120. Switch to ZenAI #affine (guild ?, channel 1415976951298129950) when ready.
guild_id = "1480562634783723610"
channel_id = "1543609865518317578"

[budget]
daily_usd = 600                    # the only spending limit: new leases are refused past it, pods stop at 100%
pools = ["research"]               # accounting label only; spend is also tracked per thread

[schedule]
daily_report = "09:00"             # lab timezone; covers everything since the previous report
director_tick_hours = 1            # the Director also wakes on every result, idea, request and world change

[research]
max_threads = 1                    # research threads (autonomous minds, each with its own GPUs) alive at once
rotate_context_tokens = 150000     # past this, the thread writes HANDOVER.md and its next pass starts a fresh session

[fleet]
idle_stop_minutes = 20
stall_minutes = 30
check_hours = 2
provision_timeout_minutes = 25
shadeform_provision_timeout_minutes = 60   # Shadeform VMs boot in 5–45 min depending on the cloud
vast_provision_timeout_minutes = 40        # Vast hosts pull the image themselves (slow links take a while)
capacity_retry_minutes = 10        # out-of-stock leases stay queued and retry…
capacity_wait_hours = 6            # …for this long before failing
stock_refresh_minutes = 5          # Runpod stock feed (`lab gpu stock`)
# Shapes always watched; experiments' own types/alternatives are added automatically.
stock_watch = { types = ["NVIDIA H100 80GB HBM3", "NVIDIA H200", "NVIDIA A100-SXM4-80GB", "NVIDIA B200", "NVIDIA H100 NVL"], counts = [1, 2, 4, 8] }
# Where leases may rent; the cheapest offer wins. SHADEFORM = Shadeform VMs (needs SHADEFORM_API_KEY):
# they cannot stop, so they are deleted on release/idle, /workspace included. VAST = Vast.ai marketplace
# containers (needs VAST_API_KEY): they stop and start like Runpod pods; host filters are in lab.toml [vast].
cloud_order = ["COMMUNITY", "SECURE", "SHADEFORM", "VAST"]
container_disk_gb = 80
volume_gb = 200
# Used only if the Runpod price API is unreachable ($/GPU/h).
price_hints = { "NVIDIA H100 80GB HBM3" = 2.99, "NVIDIA H200" = 3.99, "NVIDIA A100-SXM4-80GB" = 1.89, "NVIDIA RTX A4000" = 0.25 }

[fleet.test_policy]                # only while test_mode = true (inactive since 2026-09-24)
max_gpus_per_experiment = 1
allowed_gpu_types = ["NVIDIA H100 80GB HBM3", "NVIDIA H100 PCIe", "NVIDIA H100 NVL"]

[sentinel.intervals]               # seconds; conditional GETs make fast polling cheap
contract = 60
llms = 60
board = 30                         # king / payout
verdicts = 60
corpus = 120
code = 300
curriculum = 300
audits = 300
upstream = 900

[affine]
our_hotkeys = []                   # add our ss58 hotkeys to get crown-expiry alerts
crown_warn_hours = 12

# Per-role overrides of lab/config.py DEFAULT_ROLES (models: threads = Fable 5.1, Director + claim checks = Opus 5.5, Concierge/Scout/daily report/routine checks = Sonnet 5), e.g.:
# [agents.thread]
# timeout_s = 5400
