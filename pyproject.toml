[project]
name = "lab"
version = "0.1.0"
description = "Always-on research lab: a control plane that wakes Claude agents, rents GPUs and talks on Discord."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
]

[project.scripts]
lab = "lab.cli:main"
labd = "lab.daemon:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
